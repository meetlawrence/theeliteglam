name: Daily Neon Database Backup

on:
  schedule:
    # Every day at 01:00 UTC (02:00 Nigeria time)
    - cron: "0 1 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-neon-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup Neon PostgreSQL to Backblaze B2
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: backup_test
          POSTGRES_PASSWORD: local_test_password
          POSTGRES_DB: restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backup_test -d restore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKBLAZE_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKBLAZE_APPLICATION_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.BACKBLAZE_REGION }}
      S3_BUCKET: ${{ secrets.BACKBLAZE_BUCKET_NAME }}
      S3_ENDPOINT: ${{ secrets.BACKBLAZE_ENDPOINT }}

    steps:
      - name: Install AWS CLI and required utilities
        shell: bash
        run: |
          set -euo pipefail

          echo "Updating Ubuntu package lists..."
          sudo apt-get update

          echo "Installing required utilities..."
          sudo apt-get install -y curl unzip jq ca-certificates

          echo "Downloading AWS CLI v2..."
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
            -o "$RUNNER_TEMP/awscliv2.zip"

          echo "Extracting AWS CLI installer..."
          unzip -q "$RUNNER_TEMP/awscliv2.zip" -d "$RUNNER_TEMP"

          echo "Installing or updating AWS CLI..."
          sudo "$RUNNER_TEMP/aws/install" --update

          echo "Verifying installations..."
          aws --version
          jq --version
          docker --version

          echo "All required tools installed successfully."

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail

          for variable in \
            DATABASE_URL \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            AWS_DEFAULT_REGION \
            S3_BUCKET \
            S3_ENDPOINT
          do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing required secret: $variable"
              exit 1
            fi
          done

      - name: Normalize database connection string
        shell: bash
        run: |
          set -euo pipefail

          DATABASE_URL="$(printf '%s' "$DATABASE_URL" | tr -d '\r\n')"

          echo "::add-mask::$DATABASE_URL"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"

      - name: Create PostgreSQL backup
        id: create_backup
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/database-backup"

          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")
          BACKUP_FILENAME="the-elite-glam-${TIMESTAMP}.dump"
          BACKUP_FILE="$RUNNER_TEMP/database-backup/$BACKUP_FILENAME"

          echo "Creating PostgreSQL 18 backup..."
          echo "Backup filename: $BACKUP_FILENAME"

          docker run --rm \
            --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e BACKUP_FILENAME="$BACKUP_FILENAME" \
            -v "$RUNNER_TEMP/database-backup:/backup" \
            postgres:18 \
            sh -c 'pg_dump \
              --dbname="$DATABASE_URL" \
              --format=custom \
              --compress=6 \
              --no-owner \
              --no-acl \
              --file="/backup/$BACKUP_FILENAME"'

          if [[ ! -s "$BACKUP_FILE" ]]; then
            echo "::error::Backup file is empty or was not created."
            exit 1
          fi

          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"
          echo "BACKUP_FILENAME=$BACKUP_FILENAME" >> "$GITHUB_ENV"

          echo "Backup created successfully."
          ls -lh "$BACKUP_FILE"

      - name: Verify backup archive
        id: verify_archive
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking PostgreSQL backup archive..."

          docker run --rm \
            -v "$RUNNER_TEMP/database-backup:/backup" \
            postgres:18 \
            pg_restore --list "/backup/$BACKUP_FILENAME" > /dev/null

          echo "Backup archive is readable."

      - name: Test database restoration
        id: restore_test
        shell: bash
        env:
          RESTORE_TEST_URL: postgresql://backup_test:local_test_password@localhost:5432/restore_test
        run: |
          set -euo pipefail

          echo "Testing backup restoration..."

          docker run --rm \
            --network host \
            -e RESTORE_TEST_URL \
            -e BACKUP_FILENAME \
            -v "$RUNNER_TEMP/database-backup:/backup" \
            postgres:18 \
            sh -c 'pg_restore \
              --dbname="$RESTORE_TEST_URL" \
              --exit-on-error \
              --no-owner \
              --no-acl \
              "/backup/$BACKUP_FILENAME"'

          echo "Backup restored successfully into temporary PostgreSQL."

      - name: Validate Backblaze endpoint
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$S3_ENDPOINT" != https://* && "$S3_ENDPOINT" != http://* ]]; then
            echo "::error::BACKBLAZE_ENDPOINT must start with https:// or http://"
            exit 1
          fi
      - name: Upload backup to Backblaze B2
        id: upload_backup
        shell: bash
        run: |
          set -euo pipefail

          BACKUP_PATH="postgresql/the-elite-glam/${BACKUP_FILENAME}"

          echo "Uploading backup to Backblaze B2..."

          aws \
            --endpoint-url "$S3_ENDPOINT" \
            s3 cp \
            "$BACKUP_FILE" \
            "s3://${S3_BUCKET}/${BACKUP_PATH}" \
            --only-show-errors

          echo "BACKUP_PATH=$BACKUP_PATH" >> "$GITHUB_ENV"

          echo "Backup uploaded successfully."

      - name: Verify uploaded backup
        id: verify_upload
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying uploaded backup..."

          REMOTE_SIZE=$(
            aws \
              --endpoint-url "$S3_ENDPOINT" \
              s3api head-object \
              --bucket "$S3_BUCKET" \
              --key "$BACKUP_PATH" \
              --query 'ContentLength' \
              --output text
          )

          LOCAL_SIZE=$(stat -c%s "$BACKUP_FILE")

          if [[ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]]; then
            echo "::error::Local and remote backup sizes do not match."
            exit 1
          fi

          echo "Uploaded backup verified successfully."
          echo "Size: $REMOTE_SIZE bytes"

      - name: Delete backups older than 30 days
        id: retention
        shell: bash
        run: |
          set -euo pipefail

          echo "Applying 30-day backup retention policy..."

          CUTOFF_EPOCH=$(date -u -d '30 days ago' +%s)
          DELETED=0
          CONTINUATION_TOKEN=""

          while true; do
            if [[ -z "$CONTINUATION_TOKEN" ]]; then
              RESPONSE=$(aws \
                --endpoint-url "$S3_ENDPOINT" \
                s3api list-objects-v2 \
                --bucket "$S3_BUCKET" \
                --prefix "postgresql/the-elite-glam/" \
                --output json)
            else
              RESPONSE=$(aws \
                --endpoint-url "$S3_ENDPOINT" \
                s3api list-objects-v2 \
                --bucket "$S3_BUCKET" \
                --prefix "postgresql/the-elite-glam/" \
                --continuation-token "$CONTINUATION_TOKEN" \
                --output json)
            fi

            while IFS= read -r OBJECT; do
              KEY=$(echo "$OBJECT" | jq -r '.Key')
              LAST_MODIFIED=$(echo "$OBJECT" | jq -r '.LastModified')
              LAST_MODIFIED_EPOCH=$(date -u -d "$LAST_MODIFIED" +%s)

              if (( LAST_MODIFIED_EPOCH < CUTOFF_EPOCH )); then
                echo "Deleting expired backup: $KEY"

                aws \
                  --endpoint-url "$S3_ENDPOINT" \
                  s3api delete-object \
                  --bucket "$S3_BUCKET" \
                  --key "$KEY"

                DELETED=$((DELETED + 1))
              fi
            done < <(echo "$RESPONSE" | jq -c '.Contents[]?')

            IS_TRUNCATED=$(echo "$RESPONSE" | jq -r '.IsTruncated')

            if [[ "$IS_TRUNCATED" != "true" ]]; then
              break
            fi

            CONTINUATION_TOKEN=$(echo "$RESPONSE" | jq -r '.NextContinuationToken')
          done

          echo "Expired backups deleted: $DELETED"
          echo "DELETED_BACKUPS=$DELETED" >> "$GITHUB_ENV"

      - name: Backup summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Database Backup Successful"
            echo ""
            echo "- Database: Neon PostgreSQL"
            echo "- Storage: Backblaze B2"
            echo "- File: $BACKUP_FILENAME"
            echo "- Location: $BACKUP_PATH"
            echo "- Archive verification: Passed"
            echo "- Restore test: Passed"
            echo "- Upload verification: Passed"
            echo "- Expired backups deleted: ${DELETED_BACKUPS:-0}"
            echo "- Time: $(date -u)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify failure by email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.BACKUP_NOTIFICATION_EMAIL }}
          password: ${{ secrets.BACKUP_SMTP_APP_PASSWORD }}
          subject: "FAILED: The Elite Glam Database Backup"
          to: ${{ secrets.BACKUP_NOTIFICATION_EMAIL }}
          from: "The Elite Glam Backup Monitor"
          body: |
            The Elite Glam daily Neon database backup has failed.

            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please open the workflow run to identify the failed step
            and investigate the error.

      - name: Failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Database Backup Failed"
            echo ""
            echo "The backup workflow failed."
            echo ""
            echo "Check the workflow logs for details."
          } >> "$GITHUB_STEP_SUMMARY"